# Check every PR; on push to main, check then deploy to Fly.io
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-progress runs when a newer commit is pushed to the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cgm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cgm_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # --include-ignored runs the Postgres-backed tests in tests/db.rs
      - name: Test
        run: cargo test --locked -- --include-ignored

  deploy:
    name: Deploy to Fly.io
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: |
          GIT_REV=$(echo ${{ github.sha }} | cut -c1-7)
          flyctl deploy --remote-only --build-arg "GIT_REV_SHORT=$GIT_REV"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
