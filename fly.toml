# Fly.io app configuration
app = "cgm-insights-api"
primary_region = "cdg"
# Time to finish in-flight requests and a running sync after SIGTERM
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]

[env]
  PORT = "3000"
  APP_ENV = "production"
  RUST_LOG = "info"

[http_service]
  internal_port = 3000
  force_https = true
  # Never stop: the CGM sync scheduler runs in this process, so a stopped machine
  # means no syncs (and LibreLink only keeps ~12 h of history). Auto-stop also left
  # machines stopped after deploys until a request woke them.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1